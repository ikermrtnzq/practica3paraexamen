<div class="container mx-auto mt-4">
    <div class="border border-cyan-500 border-4 mx-auto w-1/2 flex flex-col p-3 mt-4 rounded shadow">
        <h1 class="text-center text-cyan-500">LOGIN</h1>
        <form #formLogin="ngForm" action="" class="flex flex-col gap-2">
            <label for="" class="block text-sm font-medium">Nombre: </label>
            <input name="cajanombre" #cajanombre type="text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <label for="" class="block text-sm font-medium">Contraseña: </label>
            <input name="cajapwd" #cajapwd type="password" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <button (click)="login()" class="bg-cyan-500 text-white px-4 py-2 rounded hover:bg-cyan-600 mt-2 transition">login</button>
        </form>
    </div>
</div>
