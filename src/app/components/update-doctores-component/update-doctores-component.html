<div class="min-h-screen bg-slate-100 flex justify-center items-center p-6">
    <div class="w-full max-w-lg bg-white border-2 border-cyan-500 rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-extrabold text-center text-slate-900 mb-6">CREATE DOCTOR</h1>
        <form #formCreate="ngForm" action="" class="flex flex-col gap-3">
            <label for="" class="text-sm font-semibold text-gray-700">Id Doctor:</label>
            <input value="{{doctor.idDoctor}}" disabled name="cajaid" #cajaid type="number" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <label for="" class="text-sm font-semibold text-gray-700">Nombre:</label>
            <input value="{{doctor.apellido}}" name="cajanombre" #cajanombre type="text" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <label for="" class="text-sm font-semibold text-gray-700">Hospital:</label>
            <select name="selecthospital" #selecthospital id=""
                    class="w-full sm:w-56 border border-slate-600 rounded-lg px-4 py-2.5 bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition cursor-pointer">
                    @for (hospital of hospitales; track hospital) {
                        <option [selected]="hospital.idHospital == doctor.idHospital" value="{{hospital.idHospital}}">{{hospital.nombre}}</option>
                    }
            </select>
            <label for="" class="text-sm font-semibold text-gray-700">Salario:</label>
            <input value="{{doctor.salario}}" name="cajasalario" #cajasalario type="number" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition">
            <label for="" class="text-sm font-semibold text-gray-700">Especialidad:</label>
            <select name="selectespecialidad" #selectespecialidad id=""
                    class="w-full sm:w-56 border border-slate-600 rounded-lg px-4 py-2.5 bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition cursor-pointer">
                    @for (especialidad of especialidades; track especialidad) {
                        <option [selected]="especialidad == doctor.especialidad"  value="{{especialidad}}">{{especialidad}}</option>
                    }
            </select>
            <button (click)="modificar()" class="w-full mt-4 bg-cyan-600 text-white font-bold py-3 rounded-lg hover:bg-cyan-700 active:scale-95 transition duration-200 shadow-md">Update</button>
        </form>
    </div>
</div>
