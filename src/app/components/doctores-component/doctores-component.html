<div class="min-h-screen bg-slate-100 p-6">
    <select (click)="buscar()" name="selectHospital" #selectHospital id="" multiple size="5"
            class="w-full sm:w-56 border border-slate-600 rounded-lg px-4 py-2.5 bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition cursor-pointer">
            @for (hospital of hospitales; track hospital) {
                <option value="{{hospital.idHospital}}">{{hospital.nombre}}</option>
            }
    </select>
    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        <h1 class="text-3xl font-extrabold text-center text-white bg-slate-900 py-6">DOCTORES</h1>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-cyan-600 text-white">
                    <tr>
                        <th class="px-6 py-4 font-bold uppercase text-sm">Nombre</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm">Oficio</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm">Salario</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm text-center">Eliminar</th>
                        <th class="px-6 py-4 font-bold uppercase text-sm text-center">Modificar</th>

                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    @for (doctor of doctores; track doctor) {
                        <tr class="hover:bg-cyan-50 transition duration-200 even:bg-gray-50">
                            <td class="px-6 py-4 font-semibold text-gray-800">{{doctor.apellido}}</td>
                            <td class="px-6 py-4 text-gray-700">{{doctor.especialidad}}</td>
                            <td class="px-6 py-4 text-gray-600">{{doctor.salario}}€</td>
                            <td class="px-6 py-4 text-center">
                                <button (click)="borrar(doctor.idDoctor)" class="px-4 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 active:scale-95 transition duration-200 shadow-md">🗑</button>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <button  class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:scale-95 transition duration-200 shadow-md"><a [routerLink]="['/modificar/', doctor.idDoctor]">✏️</a></button>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
